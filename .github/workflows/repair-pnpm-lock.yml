name: Repair pinned package manager metadata
on:
  push:
    branches: [feat/community-research-platform]
    paths: [.github/workflows/repair-pnpm-lock.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'LingyeNBird/CodexSubscribeStudy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: corepack enable
      - name: Resolve metadata once and verify frozen install
        working-directory: web
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Commit only the regenerated lockfile
        run: |
          git diff --exit-code -- web/package.json
          git diff --check
          git add web/pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: synchronize pinned pnpm metadata in frontend lockfile'
          git push origin HEAD:refs/heads/feat/community-research-platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-pnpm-lock
          path: web/pnpm-lock.yaml
          retention-days: 3
