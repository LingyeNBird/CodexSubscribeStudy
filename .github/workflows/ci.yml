name: Study verification and GHCR publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record source integrity
        run: |
          test -f internal/study/aggregate.go
          test -f web/src/App.vue
          test ! -f .github/workflows/apply-study-source.yml
          test ! -f .github/workflows/repair-pnpm-lock.yml
          mkdir -p "$RUNNER_TEMP/study-review"
          echo "STUDY_REVIEW_OUTPUT=$RUNNER_TEMP/study-review" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/study-review/tested-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/study-review/source-manifest.txt"
          git diff --check
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: corepack enable
      - name: Build Vue SPA from locked dependencies
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml package.json
          pnpm check
          pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Validate Go protocol, aggregation, store and API
        run: |
          go mod download
          go vet ./...
          go test -race -count=1 -v ./... | tee "$STUDY_REVIEW_OUTPUT/go-tests.log"
          go build -trimpath -o "$RUNNER_TEMP/study" ./cmd/study
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/study-arm64" ./cmd/study
          echo "STUDY_BINARY=$RUNNER_TEMP/study" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.57.0' 'cryptography>=45,<46'
          python -m playwright install --with-deps chromium
      - name: Exercise real Go and Vue signed submissions and privacy
        run: python scripts/browser_smoke.py
      - name: Verify production container build without publishing
        run: docker build --tag study-verification:local .
      - name: Retain synthetic test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-platform-evidence
          retention-days: 7
          path: |
            ${{ env.STUDY_REVIEW_OUTPUT }}/*.png
            ${{ env.STUDY_REVIEW_OUTPUT }}/*.json
            ${{ env.STUDY_REVIEW_OUTPUT }}/*.txt
            ${{ env.STUDY_REVIEW_OUTPUT }}/*.log

  publish:
    name: Build and publish GHCR image
    needs: verify
    if: >-
      github.repository == 'LingyeNBird/CodexSubscribeStudy' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and OCI labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long
      - name: Build and push AMD64 and ARM64 images
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=study-ghcr
          cache-to: type=gha,scope=study-ghcr,mode=max
      - name: Verify published manifest and record pull commands
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > "$RUNNER_TEMP/study-manifest.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | (index("linux/amd64") != null) and (index("linux/arm64") != null)' "$RUNNER_TEMP/study-manifest.json"
          {
            echo '## Published GHCR image'
            echo
            echo 'Platforms: linux/amd64, linux/arm64'
            echo
            echo '```sh'
            echo "docker pull $IMAGE:latest"
            echo "docker pull $IMAGE:sha-$GITHUB_SHA"
            echo "docker pull $IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
