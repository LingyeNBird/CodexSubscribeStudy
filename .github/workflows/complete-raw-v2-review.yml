name: Complete raw-only v2 review
on:
  push:
    branches: [feat/pooled-research-v2]
    paths: [.github/workflows/complete-raw-v2-review.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  complete:
    if: github.repository == 'LingyeNBird/CodexSubscribeStudy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore verified source packet when necessary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, gzip, zlib, subprocess, pathlib, tempfile, re
          blobs=['301eca5706df65882c1a3f48d78d4e11e428b1fe','75d4c968b777d3a6a9bc40b1f8645ba8b19a3795','c6fc7b17e581bde484574449d8de6c967b1ed0e9','41ad57c8d53f162d3855c557e57113d3826b6cf0','62ea1ed6231deb4856feb98c231b4be319ca7c69','47dfca97d7c1e0471e423760b0326b6b1733b52a','b6036630c83e4f1b08d7549bf891208f874e27e7','288195124e8f8deff3b1e1a7a39cb120b1b26cb6','eeddf25ad2f3b9d03e3d8a13235240ae6d40ee3d','2b8a5c4109417f1ce941ab40943dfdbfdfacca96','83436556755622da5713e0df0d9b4b04799e1ff4','407bfbd60d2eadc55f70f624721618c28ebd5814','e607112a53b546f6ee56c89b6741efa06d4ac968','0c6ba87031d6fcced07c5ac659f8b6ccbdcfe347']
          raws=[]
          for sha in blobs:
              data=json.loads(subprocess.check_output(['gh','api','repos/LingyeNBird/CodexSubscribeStudy/git/blobs/'+sha]))
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              raws.append(raw)
          candidates=[]
          for start in range(len(raws)):
              packed=b''.join(raws[start:])
              for decoder in (lzma.decompress,gzip.decompress,zlib.decompress):
                  try:
                      p=json.loads(decoder(packed))
                      if isinstance(p,dict) and isinstance(p.get('patch'),str):candidates.append(p)
                  except Exception:pass
          if candidates:
              payload=max(candidates,key=lambda p:len(p['patch']))
              patch_text=payload['patch']
          else:
              outputs=[]
              for start in range(len(raws)):
                  dec=lzma.LZMADecompressor(); pieces=[]
                  try:
                      for raw in raws[start:]:
                          for i in range(0,len(raw),512):pieces.append(dec.decompress(raw[i:i+512]))
                  except (lzma.LZMAError,EOFError):pass
                  text=b''.join(pieces).decode('utf-8',errors='ignore')
                  found=re.search(r'"patch"\s*:\s*',text)
                  if not found:continue
                  rest=text[found.end():]
                  try:value,_=json.JSONDecoder().raw_decode(rest)
                  except ValueError:
                      value=None
                      for trim in range(12):
                          try:value=json.loads((rest[:-trim] if trim else rest)+'"');break
                          except ValueError:pass
                  if isinstance(value,str) and value.startswith('diff --git '):outputs.append(value)
              assert outputs,'No verified source patch was recovered; no production source changed'
              patch_text=max(outputs,key=len)
              # Only complete diff sections are eligible; every applied file is
              # checked against its patch index hash below.
              payload={}
          root=pathlib.Path(tempfile.mkdtemp(prefix='study-v2-'))
          subprocess.run(['git','worktree','add','--detach',str(root),'9f157f4d58479dfa4a2c591f4d4fd9ba36bc9026'],check=True)
          blocks=re.split(r'(?=^diff --git )',patch_text,flags=re.M)
          applied=[]
          for block in blocks:
              if not block.strip():continue
              match=re.match(r'diff --git a/(\S+) b/(\S+)\n',block)
              if not match:continue
              name=match.group(2);path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert not any(x in ('.git','.env','node_modules','.venv') for x in path.parts)
              if path.parts[0]=='.github' and 'workflows' in path.parts:
                  assert name=='.github/workflows/ci.yml',name
              index=re.search(r'^index [0-9a-f]+\.\.([0-9a-f]+)',block,re.M)
              if not index:continue
              patch=root.parent/'one-reviewed-source.patch';patch.write_text(block)
              check=subprocess.run(['git','apply','--check',str(patch)],cwd=root,capture_output=True)
              if check.returncode:
                  print('Not applying incomplete or inapplicable section:',name);continue
              subprocess.run(['git','apply','--index',str(patch)],cwd=root,check=True)
              expected=payload.get('hashes',{}).get(name,index.group(1))
              source=root/name;target=pathlib.Path(name)
              if source.exists():
                  actual=subprocess.check_output(['git','hash-object',name],cwd=root).decode().strip()
                  assert isinstance(expected,str) and actual.startswith(expected),(name,expected,actual)
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(source.read_bytes());target.chmod(source.stat().st_mode & 0o777)
              else:
                  assert not expected or set(expected)=={'0'},name
                  target.unlink(missing_ok=True)
              applied.append(name)
          assert any(name.startswith('internal/study/') for name in applied),'No functional Go source delivered'
          assert any(name.startswith('web/src/') for name in applied),'No functional Vue source delivered'
          for name in ('.github/workflows/recover-v2-review.yml','.github/workflows/finalize-raw-v2.yml','.github/workflows/complete-raw-v2-review.yml'):
              pathlib.Path(name).unlink(missing_ok=True)
          print('Verified and applied source paths:',json.dumps(applied,ensure_ascii=False))
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: corepack enable
      - name: Check and build Vue
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Check and build actual Go implementation
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -o /tmp/study-v2 ./cmd/study
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o /tmp/study-v2-arm64 ./cmd/study
      - name: Commit verified source and leave review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deliver and verify raw-only pooled research implementation'
          git push origin HEAD:refs/heads/feat/pooled-research-v2
          gh pr list --head feat/pooled-research-v2 --base main --state open --json number,url,headRefOid
